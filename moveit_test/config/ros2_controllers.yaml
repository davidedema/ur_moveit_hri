# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    robot1_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    robot2_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

robot1_arm_controller:
  ros__parameters:
    joints:
      - robot1shoulder_pan_joint
      - robot1shoulder_lift_joint
      - robot1elbow_joint
      - robot1wrist_1_joint
      - robot1wrist_2_joint
      - robot1wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
robot2_arm_controller:
  ros__parameters:
    joints:
      - robot2shoulder_pan_joint
      - robot2shoulder_lift_joint
      - robot2elbow_joint
      - robot2wrist_1_joint
      - robot2wrist_2_joint
      - robot2wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity