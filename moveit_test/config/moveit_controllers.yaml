# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - robot1_arm_controller
    - robot2_arm_controller

  robot1_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - robot1shoulder_pan_joint
      - robot1shoulder_lift_joint
      - robot1elbow_joint
      - robot1wrist_1_joint
      - robot1wrist_2_joint
      - robot1wrist_3_joint
    action_ns: follow_joint_trajectory
    default: true
  robot2_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - robot2shoulder_pan_joint
      - robot2shoulder_lift_joint
      - robot2elbow_joint
      - robot2wrist_1_joint
      - robot2wrist_2_joint
      - robot2wrist_3_joint
    action_ns: follow_joint_trajectory
    default: true