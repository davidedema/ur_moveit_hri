robot2:
  controller_manager:
    ros__parameters:

      namespace: robot2

      update_rate: 100 # Hz

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      io_and_status_controller:
        type: ur_controllers/GPIOController

      speed_scaling_state_broadcaster:
        type: ur_controllers/SpeedScalingStateBroadcaster

      force_torque_sensor_broadcaster:
        type: ur_controllers/ForceTorqueStateBroadcaster

      joint_trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      scaled_joint_trajectory_controller:
        type: ur_controllers/ScaledJointTrajectoryController

      forward_velocity_controller:
        type: velocity_controllers/JointGroupVelocityController

      forward_position_controller:
        type: position_controllers/JointGroupPositionController

      cartesian_motion_controller:
        type: cartesian_motion_controller/CartesianMotionController

      robotiq_gripper_controller:
        type: position_controllers/GripperActionController
      
      robotiq_activation_controller:
        type: robotiq_controllers/RobotiqActivationController

  speed_scaling_state_broadcaster:
    ros__parameters:
      state_publish_rate: 100.0


  force_torque_sensor_broadcaster:
    ros__parameters:
      sensor_name: tcp_fts_sensor
      state_interface_names:
        - force.x
        - force.y
        - force.z
        - torque.x
        - torque.y
        - torque.z
      frame_id: tool0
      topic_name: ft_data


  joint_trajectory_controller:
    ros__parameters:
      namespace: robot2
      joints:
        - robot2shoulder_pan_joint
        - robot2shoulder_lift_joint
        - robot2elbow_joint
        - robot2wrist_1_joint
        - robot2wrist_2_joint
        - robot2wrist_3_joint
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
      state_publish_rate: 100.0
      action_monitor_rate: 20.0
      allow_partial_joints_goal: false
      constraints:
        stopped_velocity_tolerance: 0.2
        goal_time: 0.0
        robot2shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
        robot2shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
        robot2elbow_joint: { trajectory: 0.2, goal: 0.1 }
        robot2wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
        robot2wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
        robot2wrist_3_joint: { trajectory: 0.2, goal: 0.1 }


  scaled_joint_trajectory_controller:
    ros__parameters:
      namespace: robot2
      joints:
        - robot2shoulder_pan_joint
        - robot2shoulder_lift_joint
        - robot2elbow_joint
        - robot2wrist_1_joint
        - robot2wrist_2_joint
        - robot2wrist_3_joint
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
      state_publish_rate: 100.0
      action_monitor_rate: 20.0
      allow_partial_joints_goal: false
      constraints:
        stopped_velocity_tolerance: 0.2
        goal_time: 0.0
        robot2shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
        robot2shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
        robot2elbow_joint: { trajectory: 0.2, goal: 0.1 }
        robot2wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
        robot2wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
        robot2wrist_3_joint: { trajectory: 0.2, goal: 0.1 }

  forward_velocity_controller:
    ros__parameters:
      joints:
        - robot2shoulder_pan_joint
        - robot2shoulder_lift_joint
        - robot2elbow_joint
        - robot2wrist_1_joint
        - robot2wrist_2_joint
        - robot2wrist_3_joint
      interface_name: velocity

  forward_position_controller:
    ros__parameters:
      joints:
        - robot2shoulder_pan_joint
        - robot2shoulder_lift_joint
        - robot2elbow_joint
        - robot2wrist_1_joint
        - robot2wrist_2_joint
        - robot2wrist_3_joint

  cartesian_motion_controller:
    ros__parameters:
      namespace: robot2

      # See the cartesian_compliance_controller
      end_effector_link: "robot2tool0"
      robot_base_link: "robot2base_link"
      joints:
        - robot2shoulder_pan_joint
        - robot2shoulder_lift_joint
        - robot2elbow_joint
        - robot2wrist_1_joint
        - robot2wrist_2_joint
        - robot2wrist_3_joint

      # See the cartesian_compliance_controller
      command_interfaces:
        - position
          #- velocity

      solver:
          error_scale: 1.0
          iterations: 10
          publish_state_feedback: True

      pd_gains:
          trans_x: {p: 1.0}
          trans_y: {p: 1.0}
          trans_z: {p: 1.0}
          rot_x: {p: 0.5}
          rot_y: {p: 0.5}
          rot_z: {p: 0.5}


  robotiq_gripper_controller:
    ros__parameters:
      namespace: robot2
      default: true
      joint: robot2robotiq_85_left_knuckle_joint
      use_effort_interface: true
      use_speed_interface: true

  robotiq_activation_controller:
    ros__parameters:
      namespace: robot2
      default: true